services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartpathy
    ports: ["3308:3306"]
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /app/backend
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"
    environment:
      DATABASE_URL: mysql://root:root@db:3306/smartpathy
    ports: ["4000:4000"]
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /app/frontend
    command: npm run dev
    environment:
      API_INTERNAL_URL: http://backend:4000
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      backend: { condition: service_healthy }

volumes:
  db_data:
